services:
  mongodb:
    image: mongo:7
    container_name: ai-video-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: ai-video-redis
    restart: unless-stopped
    ports:
      - "6380:6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ai-video-api
    container_name: ai-video-api
    restart: unless-stopped
    environment:
      PORT: 4000
      MONGODB_URI: mongodb://mongodb:27017/ai-video-generator
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PUBLIC_API_BASE_URL: http://api:4000
      AI_PROVIDER: ${AI_PROVIDER:-fallback}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      TTS_PROVIDER: ${TTS_PROVIDER:-edge}
      EDGE_TTS_VOICE: ${EDGE_TTS_VOICE:-tr-TR-EmelNeural}
      EDGE_TTS_LANG: ${EDGE_TTS_LANG:-tr-TR}
      EDGE_TTS_OUTPUT_FORMAT: ${EDGE_TTS_OUTPUT_FORMAT:-audio-24khz-48kbitrate-mono-mp3}
      EDGE_TTS_RATE: ${EDGE_TTS_RATE:-+0%}
      EDGE_TTS_PITCH: ${EDGE_TTS_PITCH:-+0Hz}
      EDGE_TTS_VOLUME: ${EDGE_TTS_VOLUME:-+0%}
      EDGE_TTS_MAX_CHARACTERS: ${EDGE_TTS_MAX_CHARACTERS:-4500}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-JBFqnCBsd6RMkjVDRZzb}
      ELEVENLABS_MODEL: ${ELEVENLABS_MODEL:-eleven_multilingual_v2}
      ELEVENLABS_MAX_CHARACTERS: ${ELEVENLABS_MAX_CHARACTERS:-4500}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-huggingface}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_IMAGE_MODEL: ${HF_IMAGE_MODEL:-stabilityai/stable-diffusion-xl-base-1.0}
      HF_INFERENCE_BASE_URL: ${HF_INFERENCE_BASE_URL:-https://api-inference.huggingface.co/models}
      HF_IMAGE_STEPS: ${HF_IMAGE_STEPS:-25}
      HF_GUIDANCE_SCALE: ${HF_GUIDANCE_SCALE:-7.5}
      OUTPUTS_DIR: /app/outputs
    ports:
      - "4000:4000"
    depends_on:
      - mongodb
      - redis
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/api/dist     
      - ./outputs:/app/outputs

  worker:
    image: ai-video-api
    container_name: ai-video-worker
    restart: unless-stopped
    command: ["pnpm", "--filter", "@ai-video/api", "start:worker"]
    environment:
      MONGODB_URI: mongodb://mongodb:27017/ai-video-generator
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PUBLIC_API_BASE_URL: http://api:4000
      AI_PROVIDER: ${AI_PROVIDER:-fallback}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      TTS_PROVIDER: ${TTS_PROVIDER:-edge}
      EDGE_TTS_VOICE: ${EDGE_TTS_VOICE:-tr-TR-EmelNeural}
      EDGE_TTS_LANG: ${EDGE_TTS_LANG:-tr-TR}
      EDGE_TTS_OUTPUT_FORMAT: ${EDGE_TTS_OUTPUT_FORMAT:-audio-24khz-48kbitrate-mono-mp3}
      EDGE_TTS_RATE: ${EDGE_TTS_RATE:-+0%}
      EDGE_TTS_PITCH: ${EDGE_TTS_PITCH:-+0Hz}
      EDGE_TTS_VOLUME: ${EDGE_TTS_VOLUME:-+0%}
      EDGE_TTS_MAX_CHARACTERS: ${EDGE_TTS_MAX_CHARACTERS:-4500}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-JBFqnCBsd6RMkjVDRZzb}
      ELEVENLABS_MODEL: ${ELEVENLABS_MODEL:-eleven_multilingual_v2}
      ELEVENLABS_MAX_CHARACTERS: ${ELEVENLABS_MAX_CHARACTERS:-4500}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-huggingface}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_IMAGE_MODEL: ${HF_IMAGE_MODEL:-stabilityai/stable-diffusion-xl-base-1.0}
      HF_INFERENCE_BASE_URL: ${HF_INFERENCE_BASE_URL:-https://api-inference.huggingface.co/models}
      HF_IMAGE_STEPS: ${HF_IMAGE_STEPS:-25}
      HF_GUIDANCE_SCALE: ${HF_GUIDANCE_SCALE:-7.5}
      OUTPUTS_DIR: /app/outputs
    depends_on:
      - api
      - mongodb
      - redis
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/api/dist     
      - ./outputs:/app/outputs

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: ai-video-web
    container_name: ai-video-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  mongodb_data:
  api_outputs:
